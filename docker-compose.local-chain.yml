# Adds a local Anvil chain (id 31337) with the 6022 contracts deployed on it:
#   docker compose -f docker-compose.yml -f docker-compose.local-chain.yml up
# Names on it don't resolve through public ENS, and it has no x402 facilitator.
services:
  agent-node-host:
    environment:
      - BLOCKCHAIN__EVM_CHAINS__31337__HTTP_URL=http://evm-node:8545
      - BLOCKCHAIN__EVM_CHAINS__31337__REQUEST_TIMEOUT_SECONDS=10
    depends_on:
      contracts-deployer:
        condition: service_completed_successfully

  evm-node:
    image: "ghcr.io/foundry-rs/foundry:v1.8.6"
    container_name: agent-node-evm-node
    user: root # the state volume is root-owned
    entrypoint: ["anvil"]
    # The state file keeps the chain across restarts, in step with the agent's database.
    command: ["--host", "0.0.0.0", "--chain-id", "31337", "--state", "/data/anvil-state.json", "--state-interval", "5"]
    ports:
      - "8545:8545" # JSON-RPC, for the browser wallet
    volumes:
      - agent-node-chain-data:/data
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 2s
      timeout: 5s
      retries: 15
    networks:
      agent-node-network:

  contracts-deployer:
    image: "ghcr.io/6022-labs/agentic-smart-contracts-anvil-deployer:1.0.0"
    container_name: agent-node-contracts-deployer
    environment:
      - ANVIL_RPC_URL=http://evm-node:8545
      # Must match the 31337 entries in src/runtime_common/settings/*.json; the deployer fails otherwise.
      - EXPECTED_CONTRACTS=AgentCollectionsManager=0x9fe46736679d2d9a65f0992f2272de9f3c7fa6e0,AgentCollectionCreatorV1=0xcf7ed3acca5a467e9e704c703e8d87f634fb0fc9,AgentEnsRegistry=0x5fc8d32690cc91d4c39d9d3abcbd16989f875707
    depends_on:
      evm-node:
        condition: service_healthy
    networks:
      agent-node-network:

volumes:
  agent-node-chain-data:
