# Single public surface of the agent-node container: web console at /,
# gateway proxied behind /api (prefix stripped), /.well-known reserved for
# the gateway (passed verbatim — future A2A agent card).
server {
    listen 5000;

    root /web;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed bundle filenames — safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: deep links serve index.html.
    location / {
        try_files $uri /index.html;
    }

    # Trailing slash on proxy_pass strips the /api prefix: /api/health -> /health.
    location /api/ {
        proxy_pass http://127.0.0.1:5001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /responses streams; buffering would hold chunks back.
        proxy_buffering off;
        # Mirrors GATEWAY_HOST__BODY_LIMIT_BYTES (4 MiB).
        client_max_body_size 4m;
    }

    # No trailing slash: path passed verbatim, the gateway owns /.well-known/*.
    location /.well-known/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
