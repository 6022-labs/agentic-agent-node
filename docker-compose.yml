services:
  agent-node-host:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: agent-node-host
    ports:
      - "5500:5000" # nginx: web console at /, gateway proxied behind /api
    environment:
      - GATEWAY_HOST__API_PORT=5001 # loopback, behind nginx (5000 is nginx)
      - RUNTIME_HOST__API_PORT=5400
      - RUNTIME_HOST__LISTEN_ADDRESS=127.0.0.1
      - RUNTIME_CLIENT__BASE_URL=http://127.0.0.1:5400
      - IPFS__NODE_HTTP_URL=http://agent-node-ipfs:5001
      - IPFS__BEARER_TOKEN=
      - JWT__SIGNING_KEY=dev-only-insecure-signing-key-change-me
      - JWT__TOKEN_TTL=1800
      - JWT__NONCE_TTL=300
      - VAULT__ADDRESS=http://agent-node-vault:8200
      - VAULT__TOKEN=wBGKZCJjfIGqIKB3HMmvcQVt
      - VAULT__KV_V1_MOUNT_PATH=secret
      - BLOCKCHAIN__EVM_CHAINS__80002__HTTP_URL=http://evm-node:8545
      - BLOCKCHAIN__EVM_CHAINS__80002__REQUEST_TIMEOUT_SECONDS=10
      - RUNTIME_DATABASE__DRIVER=postgres
      - RUNTIME_DATABASE__URL=host=agent-node-db port=5432 user=postgres password=root dbname=postgres sslmode=disable
      - RUNTIME_MIGRATIONS__FOLDER_PATH=/migrations
      - AGENT_IDENTITY__RUNTIME_URL=http://localhost:5500
      - TELEMETRY__ENABLED=true
      - TELEMETRY__ENDPOINT=agent-node-alloy:4317
      - TELEMETRY__INSECURE=true
      - TELEMETRY__NODE_ID=local-dev
    networks:
      agent-node-network:
    depends_on:
      agent-node-db:
        condition: service_healthy
      agent-node-vault:
        condition: service_started
      agent-node-ipfs:
        condition: service_started

  agent-node-ipfs:
    image: "ipfs/kubo:v0.42.0"
    container_name: agent-node-ipfs
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        ipfs init --profile=server 2>/dev/null || true;
        ipfs config Addresses.API /ip4/0.0.0.0/tcp/5001;
        exec ipfs daemon --migrate=true
    ports:
      - "5001:5001" # RPC API (the runtime talks to this)
      - "8080:8080" # HTTP gateway
      - "4001:4001" # libp2p swarm (tcp)
      - "4001:4001/udp" # libp2p swarm (quic)
    volumes:
      - agent-node-ipfs-data:/data/ipfs
    networks:
      agent-node-network:

  agent-node-db:
    image: "postgres:18-alpine"
    container_name: agent-node-db
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "root"
      POSTGRES_DB: "postgres"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 10
    networks:
      agent-node-network:
    volumes:
      - agent-node-db-data:/var/lib/postgresql/data

  agent-node-pgadmin:
    image: "dpage/pgadmin4:9.14"
    container_name: agent-node-pgadmin
    user: "root"
    depends_on:
      agent-node-db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: "pgadmin4@pgadmin.org"
      PGADMIN_DEFAULT_PASSWORD: "root"
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    networks:
      agent-node-network:
    volumes:
      - ./pgadmin-servers.json:/pgadmin4/servers.json

  agent-node-vault:
    image: hashicorp/vault:1.21
    container_name: agent-node-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "wBGKZCJjfIGqIKB3HMmvcQVt"
    volumes:
      - agent-node-vault-data:/vault/file
    networks:
      agent-node-network:
    command: >
      /bin/sh -c "
      vault server -dev -dev-listen-address=0.0.0.0:8200 -dev-root-token-id=wBGKZCJjfIGqIKB3HMmvcQVt &
      sleep 5 &&
      VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN=wBGKZCJjfIGqIKB3HMmvcQVt vault secrets disable secret &&
      VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN=wBGKZCJjfIGqIKB3HMmvcQVt vault secrets enable -version=1 -path=secret kv &&
      wait"

  # ---------------------------------------------------------------------------
  # Observability stack: Alloy (OTLP collector) -> Mimir (metrics) + Loki (logs)
  # + Tempo (traces), visualized in Grafana. Multiple agent nodes can point at one shared stack;
  # the agent.node.id / service.instance.id resource attribute distinguishes them.
  # ---------------------------------------------------------------------------
  agent-node-alloy:
    image: "grafana/alloy:v1.17.0"
    container_name: agent-node-alloy
    environment:
      - LOKI_URL=http://agent-node-loki:3100
      - MIMIR_URL=http://agent-node-mimir:9009
      - TEMPO_OTLP_URL=http://agent-node-tempo:4318
    command:
      ["run", "--stability.level=experimental", "/etc/alloy/config.alloy"]
    volumes:
      - ./grafana/alloy/alloy-config.alloy:/etc/alloy/config.alloy
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    networks:
      agent-node-network:

  agent-node-mimir:
    image: "grafana/mimir:3.1.1"
    container_name: agent-node-mimir
    command: ["--config.file=/etc/mimir/mimir.yml", "--target=all"]
    volumes:
      - ./grafana/mimir/mimir-config.yaml:/etc/mimir/mimir.yml
      - agent-node-mimir-data:/mimir-data
    ports:
      - "9009:9009"
    networks:
      agent-node-network:

  agent-node-loki:
    image: "grafana/loki:3.7.2"
    container_name: agent-node-loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./grafana/loki/loki-config.yaml:/etc/loki/loki.yaml
      - agent-node-loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      agent-node-network:

  agent-node-tempo:
    image: "grafana/tempo:3.0.0"
    container_name: agent-node-tempo
    depends_on:
      - agent-node-mimir
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./grafana/tempo/tempo-config.yaml:/etc/tempo/tempo.yml
      - agent-node-tempo-data:/var/tempo
    ports:
      - "3200:3200"
    networks:
      agent-node-network:

  agent-node-grafana:
    image: "grafana/grafana:12.3.7"
    container_name: agent-node-grafana
    depends_on:
      - agent-node-mimir
      - agent-node-loki
      - agent-node-tempo
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      MIMIR_URL: "http://agent-node-mimir:9009"
      LOKI_URL: "http://agent-node-loki:3100"
      TEMPO_URL: "http://agent-node-tempo:3200"
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      agent-node-network:

networks:
  agent-node-network:

volumes:
  agent-node-db-data:
  agent-node-vault-data:
  agent-node-ipfs-data:
  agent-node-mimir-data:
  agent-node-loki-data:
  agent-node-tempo-data:
