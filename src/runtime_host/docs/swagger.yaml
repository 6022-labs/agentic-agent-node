info:
  contact: {}
  description: Internal-only runtime + knowledge surface on 127.0.0.1; gateway_host
    calls it; mounted under /internal.
  title: Agentic Agent Node — Runtime Host API
  version: "1.0"
paths:
  /internal/agent/collections:
    get:
      parameters:
      - in: query
        name: chainId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.AgentCollectionsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "500":
          description: internal_error
          schema:
            $ref: '#/definitions/errors.InternalError'
        "502":
          description: collections_read_failed
          schema:
            $ref: '#/definitions/errors.UnavailableError'
      summary: List agent collections
      tags:
      - Internal
  /internal/agent/guidance:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.AgentGuidanceResponse'
        "500":
          description: guidance_lookup_failed or agent_lookup_failed
          schema:
            $ref: '#/definitions/errors.InternalError'
      summary: Get agent guidance
      tags:
      - Internal
    put:
      consumes:
      - application/json
      parameters:
      - description: Agent guidance
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.SetAgentGuidanceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.AgentGuidanceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "500":
          description: guidance_update_failed or agent_lookup_failed
          schema:
            $ref: '#/definitions/errors.InternalError'
      summary: Set agent guidance
      tags:
      - Internal
  /internal/agent/registration:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.AgentRegistrationResponse'
        "404":
          description: draft_not_found
          schema:
            $ref: '#/definitions/errors.NotFoundError'
        "500":
          description: agent_lookup_failed, state_lookup_failed, agent_addresses_lookup_failed
          schema:
            $ref: '#/definitions/errors.InternalError'
      summary: Get agent registration draft
      tags:
      - Internal
    post:
      consumes:
      - multipart/form-data
      description: Validates the collection + form and binds the draft to the node
        wallet. Returns stored draft + status.
      parameters:
      - description: Collection address
        in: formData
        name: collectionAddress
        required: true
        type: string
      - description: Owner address
        in: formData
        name: owner
        required: true
        type: string
      - description: Agent name
        in: formData
        name: name
        required: true
        type: string
      - description: Token id this agent clones
        in: formData
        name: cloneOf
        type: integer
      - description: Attributes as a JSON object string; must include the required
          attributes
        in: formData
        name: attributes
        required: true
        type: string
      - description: Base image to frame
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.AgentRegistrationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "500":
          description: agent_lookup_failed, agent_save_failed or image_generation_failed
          schema:
            $ref: '#/definitions/errors.InternalError'
        "502":
          description: collection_check_failed, wallet_not_ready or image_upload_failed
          schema:
            $ref: '#/definitions/errors.UnavailableError'
      summary: Save agent registration draft
      tags:
      - Internal
  /internal/agent/registration/ens-info:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.EnsInfoResponse'
        "404":
          description: draft_not_found
          schema:
            $ref: '#/definitions/errors.NotFoundError'
        "409":
          description: not_minted
          schema:
            $ref: '#/definitions/errors.ConflictError'
        "500":
          description: agent_lookup_failed
          schema:
            $ref: '#/definitions/errors.InternalError'
      summary: Get ENS calldata
      tags:
      - Internal
  /internal/agent/registration/ens/check:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.RegistrationStatusResponse'
        "409":
          description: not_minted
          schema:
            $ref: '#/definitions/errors.ConflictError'
        "500":
          description: agent_lookup_failed, state_lookup_failed or ens_reconcile_failed
          schema:
            $ref: '#/definitions/errors.InternalError'
        "502":
          description: ens_read_failed
          schema:
            $ref: '#/definitions/errors.UnavailableError'
      summary: Check ENS status
      tags:
      - Internal
  /internal/agent/registration/mint-info:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.MintInfoResponse'
        "404":
          description: draft_not_found
          schema:
            $ref: '#/definitions/errors.NotFoundError'
        "409":
          description: owner_missing
          schema:
            $ref: '#/definitions/errors.ConflictError'
        "500":
          description: agent_lookup_failed or agent_addresses_lookup_failed
          schema:
            $ref: '#/definitions/errors.InternalError'
        "502":
          description: collection_read_failed
          schema:
            $ref: '#/definitions/errors.UnavailableError'
      summary: Get mint calldata
      tags:
      - Internal
  /internal/agent/registration/mint/check:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.RegistrationStatusResponse'
        "404":
          description: draft_not_found
          schema:
            $ref: '#/definitions/errors.NotFoundError'
        "500":
          description: agent_lookup_failed, state_lookup_failed or mint_reconcile_failed
          schema:
            $ref: '#/definitions/errors.InternalError'
        "502":
          description: chain_read_failed
          schema:
            $ref: '#/definitions/errors.UnavailableError'
      summary: Check mint status
      tags:
      - Internal
  /internal/agent/registration/self:
    post:
      description: Uses the node's bootstrap wallet to mint (or create a mint proposal)
        and ENS-register the stored draft.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.RegistrationStatusResponse'
        "404":
          description: draft_not_found
          schema:
            $ref: '#/definitions/errors.NotFoundError'
        "409":
          description: owner_missing
          schema:
            $ref: '#/definitions/errors.ConflictError'
        "500":
          description: self_mint_failed, self_ens_failed or mint_reconcile_failed
          schema:
            $ref: '#/definitions/errors.InternalError'
        "502":
          description: chain_read_failed
          schema:
            $ref: '#/definitions/errors.UnavailableError'
      summary: Self mint + ENS register
      tags:
      - Internal
  /internal/agent/soul:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.AgentSoulResponse'
        "404":
          description: identity_not_found
          schema:
            $ref: '#/definitions/errors.NotFoundError'
        "500":
          description: soul_lookup_failed
          schema:
            $ref: '#/definitions/errors.InternalError'
      summary: Get agent soul
      tags:
      - Internal
  /internal/authorize:
    post:
      consumes:
      - application/json
      description: Resolves the identity, fetches OwnerOf(tokenId), compares to the
        supplied address. Used by /auth/verify.
      parameters:
      - description: Address to check
        in: body
        name: request
        required: true
        schema:
