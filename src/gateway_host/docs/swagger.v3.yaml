externalDocs:
  description: ""
  url: ""
info:
  description: 'Public HTTP front for one agent: auth (JWT + EIP-191), bootstrap status,
    config endpoints, /responses. Authenticated routes proxy to runtime_host on the
    loopback interface.'
  title: Agentic Agent Node — Gateway Host API
  version: "1.0"
openapi: 3.1.0
paths:
  /.well-known/6022:
    get:
      description: 6022 discovery document (identity + invocation), open/unauthenticated.
        Documents POST /responses, including the caller-supplied `instructions` system
        prompt. Requires agent identity, so it errors until the node is registered.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.WellKnownAgent6022'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.NotFoundError'
          description: Not Found
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.UnavailableError'
          description: Bad Gateway
      summary: 6022 agent card
      tags:
      - "6022"
  /.well-known/agent-card.json:
    get:
      description: A2A v1.0 discovery document (ProtoJSON), open/unauthenticated.
        supportedInterfaces advertises the SendMessage endpoint. Requires agent identity,
        so it errors until the node is registered.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.WellKnownAgentCard'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.NotFoundError'
          description: Not Found
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.UnavailableError'
          description: Bad Gateway
      summary: A2A agent card
      tags:
      - A2A
  /a2a:
    post:
      description: 'JSON-RPC 2.0 "SendMessage" (A2A v1.0). Maps the message onto one
        inference turn and returns an immediate agent Message in result.message. x402-gated
        like /responses: send a PAYMENT-SIGNATURE header.'
      parameters:
      - description: x402 v2 payment payload (base64 JSON)
        in: header
        name: PAYMENT-SIGNATURE
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/requests.A2ARequest'
                description: JSON-RPC SendMessage request
                summary: request
        description: JSON-RPC SendMessage request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.A2AResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.ValidationError'
          description: Bad Request
        "402":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/x402.PaymentRequired'
          description: Payment Required
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.UnavailableError'
          description: runtime_unavailable
      summary: A2A SendMessage (JSON-RPC)
      tags:
      - A2A
  /agent/collections:
    get:
      parameters:
      - in: query
        name: chainId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.AgentCollectionsResponse'
          description: OK
      security:
      - BearerAuth: []
      summary: List agent collections
      tags:
      - AgentCollections
  /agent/registration:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.AgentRegistrationResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.Map'
          description: draft_not_found
      security:
      - BearerAuth: []
      summary: Get agent registration draft
      tags:
      - AgentRegistration
    post:
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
              - title: collectionAddress
                type: string
              - title: name
                type: string
              - title: role
                type: string
              - title: cloneOf
                type: integer
              - title: attributes
                type: string
              - title: image
                type: file
          multipart/form-data:
            schema:
              type: object
        description: Collection address | Agent name | Agent role | Token id this
          agent clones | Attributes as a JSON object string | Base image to frame
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.AgentRegistrationResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.ValidationError'
          description: Bad Request
      security:
      - BearerAuth: []
      summary: Save agent registration draft
      tags:
      - AgentRegistration
  /agent/registration/ens-info:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.EnsInfoResponse'
          description: OK
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.Map'
          description: not_minted
      security:
      - BearerAuth: []
      summary: Get ENS calldata
      tags:
      - AgentRegistration
  /agent/registration/ens/check:
    post:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.RegistrationStatusResponse'
          description: OK
      security:
      - BearerAuth: []
      summary: Check ENS status
      tags:
      - AgentRegistration
  /agent/registration/mint-info:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MintInfoResponse'
          description: OK
      security:
      - BearerAuth: []
      summary: Get mint calldata
      tags:
      - AgentRegistration
  /agent/registration/mint/check:
    post:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.RegistrationStatusResponse'
          description: OK
      security:
      - BearerAuth: []
      summary: Check mint status
      tags:
      - AgentRegistration
  /agent/registration/self:
    post:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.RegistrationStatusResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.Map'
          description: draft_not_found
      security:
      - BearerAuth: []
      summary: Self mint + ENS register
      tags:
      - AgentRegistration
  /auth/challenge:
    get:
      description: Returns a fresh nonce + expiry. The caller signs the nonce with
        their wallet (EIP-191 personal_sign) and posts the result to /auth/verify.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.GetAuthChallengeResponse'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.Map'
          description: Internal Server Error
      summary: Auth challenge
      tags:
      - Auth
  /auth/verify:
    post:
      description: Verifies the EIP-191 signature, checks the recovered address against
        the NFT owner via the worker, and issues a HS256 JWT.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/requests.VerifyAuthRequest'
                description: Address + signature + nonce
                summary: request
        description: Address + signature + nonce
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.VerifyAuthResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.ValidationError'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.Map'
          description: nonce_not_found | signature_mismatch | not_authorized
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.Map'
          description: identity_not_found
      summary: Auth verify
      tags:
      - Auth
  /config:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.BlockchainConfigResponse'
          description: OK
      summary: Public chain config
      tags:
      - Config
  /config/llm:
    delete:
      responses:
        "204": {}
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.Map'
          description: runtime_unavailable
      security:
      - BearerAuth: []
      summary: Delete LLM config
      tags:
      - Config
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.GetLlmConfigResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.Map'
          description: not_configured
      security:
