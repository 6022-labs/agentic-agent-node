components:
  schemas:
    enums.ConversationPlatform:
      enum:
      - none
      - slack
      type: string
      x-enum-varnames:
      - ConversationPlatformNone
      - ConversationPlatformSlack
    enums.MessageRole:
      enum:
      - user
      - assistant
      - system
      type: string
      x-enum-varnames:
      - MessageRoleUser
      - MessageRoleAssistant
      - MessageRoleSystem
    errors.NotFoundError:
      properties:
        code:
          type: string
        message:
          type: string
      type: object
    errors.ValidationError:
      properties:
        field:
          type: string
        message:
          type: string
      type: object
    fiber.Map:
      additionalProperties: {}
      type: object
    models.ExternalPaymentRule:
      properties:
        addressPatterns:
          items:
            type: string
          type: array
          uniqueItems: false
        asset:
          type: string
        eip712Name:
          type: string
        eip712Version:
          type: string
        id:
          type: string
        maxTimeoutSeconds:
          type: integer
        name:
          type: string
        network:
          type: string
        payTo:
          type: string
        price:
          type: string
      type: object
    requests.AppendConversationMessageInput:
      properties:
        content:
          type: string
        role:
          $ref: '#/components/schemas/enums.MessageRole'
        timestamp:
          type: string
      type: object
    requests.AppendConversationMessagesRequest:
      properties:
        messages:
          items:
            $ref: '#/components/schemas/requests.AppendConversationMessageInput'
          type: array
          uniqueItems: false
      type: object
    requests.CreateMcpConnectionRequest:
      properties:
        authHeaderName:
          type: string
        authHeaderValue:
          type: string
        name:
          type: string
        url:
          type: string
      type: object
    requests.CreateResponseRequest:
      properties:
        conversationId:
          type: string
        forceConclusion:
          type: boolean
        input:
          items:
            $ref: '#/components/schemas/requests.InputMessageRequest'
          type: array
          uniqueItems: false
        options:
          $ref: '#/components/schemas/requests.InputOptionsRequest'
        platform:
          $ref: '#/components/schemas/enums.ConversationPlatform'
        prompt:
          type: string
        tools:
          items:
            $ref: '#/components/schemas/requests.InputToolRequest'
          type: array
          uniqueItems: false
      type: object
    requests.InputMessageRequest:
      properties:
        author:
          type: string
        content:
          type: string
        id:
          type: string
        role:
          $ref: '#/components/schemas/enums.MessageRole'
        timestamp:
          type: string
      type: object
    requests.InputOptionsRequest:
      properties:
        maxTokens:
          type: integer
        stop:
          items:
            type: string
          type: array
          uniqueItems: false
        temperature:
          type: number
      type: object
    requests.InputToolEndpointRequest:
      properties:
        authHeader:
          type: string
        kind:
          type: string
        url:
          type: string
      type: object
    requests.InputToolRequest:
      properties:
        description:
          type: string
        endpoint:
          $ref: '#/components/schemas/requests.InputToolEndpointRequest'
        name:
          type: string
        parameters:
          additionalProperties: {}
          type: object
      type: object
    requests.SavePaymentRuleRequest:
      properties:
        addressPatterns:
          items:
            type: string
          type: array
          uniqueItems: false
        asset:
          type: string
        eip712Name:
          type: string
        eip712Version:
          type: string
        maxTimeoutSeconds:
          type: integer
        name:
          type: string
        network:
          type: string
        payTo:
          type: string
        price:
          type: string
      type: object
    requests.SetLlmConfigRequest:
      properties:
        apiKey:
          type: string
        baseUrl:
          type: string
        extensions:
          additionalProperties: {}
          type: object
        model:
          type: string
        provider:
          type: string
      type: object
    requests.VerifyAuthRequest:
      properties:
        address:
          type: string
        nonce:
          type: string
        signature:
          type: string
      type: object
    responses.AgentCollectionResponse:
      properties:
        address:
          type: string
        description:
          type: string
        moderatorCount:
          type: integer
        name:
          type: string
        nextTokenId:
          type: integer
      type: object
    responses.AgentCollectionsResponse:
      properties:
        collections:
          items:
            $ref: '#/components/schemas/responses.AgentCollectionResponse'
          type: array
          uniqueItems: false
      type: object
    responses.AgentRegistrationResponse:
      properties:
        attributes:
          additionalProperties:
            type: string
          type: object
        cloneOf:
          type: integer
        collectionAddress:
          type: string
        ensDomain:
          type: string
        ensStatus:
          type: string
        images:
          additionalProperties:
            type: string
          type: object
        mintStatus:
          type: string
        name:
          type: string
        owner:
          type: string
        proposalId:
          type: integer
        role:
          type: string
        tokenId:
          type: integer
        walletAddress:
          type: string
      type: object
    responses.AppendConversationMessagesResponse:
      properties:
        inserted:
          items:
            $ref: '#/components/schemas/responses.ConversationMessage'
          type: array
          uniqueItems: false
      type: object
    responses.BlockchainConfigResponse:
      properties:
        chainId:
          type: integer
        collectionCreatorAddress:
          type: string
        collectionsManagerAddress:
          type: string
        ensRegistryAddress:
          type: string
        facilitatorNetworks:
          items:
            type: string
          type: array
          uniqueItems: false
        token6022Address:
          type: string
      type: object
    responses.ConversationMessage:
      properties:
        content:
          type: string
        conversationId:
          type: string
        id:
          type: string
        role:
          type: string
        timestamp:
          type: string
      type: object
    responses.ConversationSummary:
      properties:
        conversationId:
          type: string
        firstMessageAt:
          type: string
        lastMessageAt:
          type: string
        messageCount:
          type: integer
      type: object
    responses.EnsInfoResponse:
      properties:
        collectionAddress:
          type: string
        records:
          items:
            $ref: '#/components/schemas/responses.KeyValue'
          type: array
          uniqueItems: false
        tokenId:
          type: integer
      type: object
    responses.GetAuthChallengeResponse:
      properties:
        expiresAt:
          type: string
        nonce:
          type: string
      type: object
    responses.GetHealthResponse:
      properties:
        status:
          type: string
        uptimeSeconds:
          type: integer
      type: object
    responses.GetLlmConfigResponse:
      properties:
        baseUrl:
          type: string
        createdAt:
          type: string
        id:
          type: string
        model:
          type: string
        provider:
          type: string
        setupStatus:
          type: string
        updatedAt:
          type: string
      type: object
    responses.GetPaymentPolicyResponse:
      properties:
        agentId:
          type: string
        agentWalletAddress:
          type: string
        createdAt:
          type: string
        id:
          type: string
        updatedAt:
          type: string
      type: object
    responses.KeyValue:
      properties:
        key:
          type: string
        value:
          type: string
      type: object
    responses.ListConversationMessagesResponse:
      properties:
        messages:
          items:
            $ref: '#/components/schemas/responses.ConversationMessage'
          type: array
          uniqueItems: false
      type: object
    responses.ListConversationsResponse:
      properties:
        conversations:
          items:
            $ref: '#/components/schemas/responses.ConversationSummary'
          type: array
          uniqueItems: false
      type: object
    responses.ListMcpConnectionsResponse:
      properties:
        connections:
          items:
            $ref: '#/components/schemas/responses.McpConnectionResponse'
          type: array
          uniqueItems: false
      type: object
    responses.ListPaymentRulesResponse:
      properties:
        rules:
          items:
            $ref: '#/components/schemas/models.ExternalPaymentRule'
          type: array
          uniqueItems: false
      type: object
    responses.McpConnectionResponse:
      properties:
        createdAt:
          type: string
        headerAuthKeys:
          items:
            type: string
          type: array
          uniqueItems: false
        id:
          type: string
        name:
          type: string
        updatedAt:
          type: string
        url:
          type: string
      type: object
    responses.MintInfoResponse:
      properties:
        attributes:
          items:
            $ref: '#/components/schemas/responses.KeyValue'
          type: array
          uniqueItems: false
        cloneOf:
          type: integer
        collectionAddress:
          type: string
        images:
          items:
            $ref: '#/components/schemas/responses.KeyValue'
          type: array
          uniqueItems: false
        moderatorCount:
          type: integer
        name:
          type: string
        ownerIsModerator:
          type: boolean
        role:
          type: string
        to:
          type: string
        wallets:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    responses.OutputMessage:
      properties:
        content:
          type: string
        id:
          type: string
        timestamp:
          type: string
      type: object
    responses.RegistrationStatusResponse:
      properties:
        ensStatus:
          type: string
        ensTxHash:
          type: string
        mintStatus:
          type: string
        mintTxHash:
          type: string
        proposalId:
          type: integer
        tokenId:
          type: integer
      type: object
    responses.Response:
      properties:
        id:
          type: string
        isFinal:
          type: boolean
        output:
          items:
            $ref: '#/components/schemas/responses.OutputMessage'
          type: array
          uniqueItems: false
        stats:
          $ref: '#/components/schemas/responses.ResponseStats'
      type: object
    responses.ResponseStats:
      properties:
        iterations:
          type: integer
        tokens:
          type: integer
        toolCalls:
          type: integer
        wallClockMs:
          type: integer
      type: object
    responses.VerifyAuthResponse:
      properties:
        expiresAt:
          type: string
        token:
          type: string
      type: object
    x402.PaymentRequired:
      properties:
        accepts:
          items:
            $ref: '#/components/schemas/x402.PaymentRequirements'
          type: array
          uniqueItems: false
        error:
          type: string
        resource:
          $ref: '#/components/schemas/x402.ResourceInfo'
        x402Version:
          type: integer
      type: object
    x402.PaymentRequirements:
      properties:
        amount:
          type: string
        asset:
          type: string
        extra:
          additionalProperties: {}
          type: object
        maxTimeoutSeconds:
          type: integer
        network:
          type: string
        payTo:
          type: string
        scheme:
          type: string
      type: object
    x402.ResourceInfo:
      properties:
        description:
          type: string
        mimeType:
          type: string
        url:
          type: string
      type: object
  securitySchemes:
    BearerAuth:
      in: header
      name: Authorization
      type: apiKey
externalDocs:
  description: ""
  url: ""
info:
  description: 'Public HTTP front for one agent: auth (JWT + EIP-191), bootstrap status,
    config endpoints, /responses. Authenticated routes proxy to runtime_host on the
    loopback interface.'
  title: Agentic Agent Node — Gateway Host API
  version: "1.0"
openapi: 3.1.0
paths:
  /agent/collections:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.AgentCollectionsResponse'
          description: OK
      security:
      - BearerAuth: []
      summary: List agent collections
      tags:
      - AgentCollections
  /agent/registration:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.AgentRegistrationResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.Map'
          description: draft_not_found
      security:
      - BearerAuth: []
      summary: Get agent registration draft
      tags:
      - AgentRegistration
    post:
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
              - title: collectionAddress
                type: string
              - title: name
                type: string
              - title: role
                type: string
              - title: cloneOf
                type: integer
              - title: attributes
                type: string
              - title: image
                type: file
          multipart/form-data:
            schema:
              type: object
        description: Collection address | Agent name | Agent role | Token id this
          agent clones | Attributes as a JSON object string | Base image to frame
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.AgentRegistrationResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.ValidationError'
          description: Bad Request
      security:
      - BearerAuth: []
      summary: Save agent registration draft
      tags:
      - AgentRegistration
  /agent/registration/ens-info:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.EnsInfoResponse'
          description: OK
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.Map'
          description: not_minted
      security:
      - BearerAuth: []
      summary: Get ENS calldata
      tags:
      - AgentRegistration
  /agent/registration/ens/check:
    post:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.RegistrationStatusResponse'
          description: OK
      security:
      - BearerAuth: []
      summary: Check ENS status
      tags:
      - AgentRegistration
  /agent/registration/mint-info:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MintInfoResponse'
          description: OK
      security:
      - BearerAuth: []
      summary: Get mint calldata
      tags:
      - AgentRegistration
  /agent/registration/mint/check:
    post:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.RegistrationStatusResponse'
          description: OK
      security:
      - BearerAuth: []
      summary: Check mint status
      tags:
      - AgentRegistration
  /agent/registration/self:
    post:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.RegistrationStatusResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.Map'
          description: draft_not_found
      security:
      - BearerAuth: []
      summary: Self mint + ENS register
      tags:
      - AgentRegistration
  /auth/challenge:
    get:
      description: Returns a fresh nonce + expiry. The caller signs the nonce with
        their wallet (EIP-191 personal_sign) and posts the result to /auth/verify.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.GetAuthChallengeResponse'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.Map'
          description: Internal Server Error
      summary: Auth challenge
      tags:
      - Auth
  /auth/verify:
    post:
      description: Verifies the EIP-191 signature, checks the recovered address against
        the NFT owner via the worker, and issues a HS256 JWT.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/requests.VerifyAuthRequest'
                description: Address + signature + nonce
                summary: request
        description: Address + signature + nonce
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.VerifyAuthResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.ValidationError'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.Map'
          description: nonce_not_found | signature_mismatch | not_authorized
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.Map'
          description: identity_not_found
      summary: Auth verify
      tags:
      - Auth
  /config:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.BlockchainConfigResponse'
          description: OK
      summary: Public chain config
      tags:
      - Config
  /config/llm:
    delete:
      responses:
        "204": {}
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.Map'
          description: runtime_unavailable
      security:
      - BearerAuth: []
      summary: Delete LLM config
      tags:
      - Config
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.GetLlmConfigResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.Map'
          description: not_configured
      security:
      - BearerAuth: []
      summary: Get LLM config
      tags:
      - Config
    post:
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/requests.SetLlmConfigRequest'
                description: LLM config
                summary: request
        description: LLM config
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.GetLlmConfigResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.ValidationError'
          description: Bad Request
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.Map'
          description: runtime_unavailable
      security:
      - BearerAuth: []
      summary: Set LLM config
      tags:
      - Config
  /config/mcp-connections:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ListMcpConnectionsResponse'
          description: OK
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.Map'
          description: runtime_unavailable
      security:
      - BearerAuth: []
      summary: List MCP connections
      tags:
      - Config
    post:
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/requests.CreateMcpConnectionRequest'
                description: MCP connection
                summary: request
        description: MCP connection
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.McpConnectionResponse'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.ValidationError'
          description: Bad Request
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.Map'
          description: runtime_unavailable
      security:
      - BearerAuth: []
      summary: Create MCP connection
      tags:
      - Config
  /config/mcp-connections/{id}:
    delete:
      parameters:
      - description: MCP connection id
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204": {}
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.ValidationError'
          description: Bad Request
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.Map'
          description: runtime_unavailable
      security:
      - BearerAuth: []
      summary: Delete MCP connection
      tags:
      - Config
  /config/payment-policy:
    delete:
      responses:
        "204": {}
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.Map'
          description: runtime_unavailable
      security:
      - BearerAuth: []
      summary: Delete payment policy
      tags:
      - Config
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.GetPaymentPolicyResponse'
          description: OK
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.Map'
          description: runtime_unavailable
      security:
      - BearerAuth: []
      summary: Get payment policy
      tags:
      - Config
  /config/payment-policy/rules:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ListPaymentRulesResponse'
          description: OK
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.Map'
          description: runtime_unavailable
      security:
      - BearerAuth: []
      summary: List payment rules
      tags:
      - Config
    post:
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/requests.SavePaymentRuleRequest'
                description: payment rule
                summary: request
        description: payment rule
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ExternalPaymentRule'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.ValidationError'
          description: Bad Request
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.Map'
          description: runtime_unavailable
      security:
      - BearerAuth: []
      summary: Create payment rule
      tags:
      - Config
  /config/payment-policy/rules/{id}:
    delete:
      parameters:
      - description: rule id
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204": {}
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.NotFoundError'
          description: Not Found
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.Map'
          description: runtime_unavailable
      security:
      - BearerAuth: []
      summary: Delete payment rule
      tags:
      - Config
    put:
      parameters:
      - description: rule id
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/requests.SavePaymentRuleRequest'
                description: payment rule
                summary: request
        description: payment rule
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ExternalPaymentRule'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.ValidationError'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.NotFoundError'
          description: Not Found
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.Map'
          description: runtime_unavailable
      security:
      - BearerAuth: []
      summary: Update payment rule
      tags:
      - Config
  /conversations:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ListConversationsResponse'
          description: OK
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fiber.Map'
