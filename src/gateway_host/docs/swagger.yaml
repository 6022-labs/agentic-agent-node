      - Conversations
  /health:
    get:
      description: Liveness probe; serves before bootstrap completes.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.GetHealthResponse'
      summary: Health
      tags:
      - Health
  /responses:
    post:
      consumes:
      - application/json
      description: 'x402 v2 gated (PAYMENT-SIGNATURE header): callers pay the cheapest
        matching option; zero-price is free.'
      parameters:
      - description: Bearer JWT; a caller the policy lets in free needs no payment
        in: header
        name: Authorization
        type: string
      - description: x402 v2 payment payload (base64 JSON), required unless free
        in: header
        name: PAYMENT-SIGNATURE
        type: string
      - description: Conversation turn
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.CreateResponseRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            PAYMENT-RESPONSE:
              description: base64 x402 settle response, paid requests only
              type: string
          schema:
            $ref: '#/definitions/responses.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "402":
          description: Payment Required
          headers:
            PAYMENT-REQUIRED:
              description: base64 x402 payment requirements
              type: string
          schema:
            $ref: '#/definitions/x402.PaymentRequired'
        "409":
          description: conversation_unavailable or agent_not_minted
          schema:
            $ref: '#/definitions/errors.ConflictError'
        "502":
          description: access_decision_unavailable or facilitator_unavailable
          schema:
            $ref: '#/definitions/errors.UnavailableError'
      summary: Create response
      tags:
      - Responses
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
