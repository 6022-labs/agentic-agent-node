info:
  contact: {}
  description: 'Public HTTP front: auth (JWT + EIP-191), config, /responses; proxies
    to runtime_host on loopback.'
  title: Agentic Agent Node — Gateway Host API
  version: "1.0"
paths:
  /.well-known/6022:
    get:
      description: Open 6022 discovery document; documents POST /responses and its
        bounded `instructions` overlay.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.WellKnownAgent6022'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.NotFoundError'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/errors.UnavailableError'
      summary: 6022 agent card
      tags:
      - "6022"
  /.well-known/agent-card.json:
    get:
      description: Open A2A v1.0 agent card (ProtoJSON); advertises SendMessage. Errors
        until the node is registered.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.WellKnownAgentCard'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.NotFoundError'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/errors.UnavailableError'
      summary: A2A agent card
      tags:
      - A2A
  /a2a:
    post:
      consumes:
      - application/json
      description: 'JSON-RPC 2.0 SendMessage (A2A v1.0): one inference turn, immediate
        reply. x402-gated like /responses.'
      parameters:
      - description: x402 v2 payment payload (base64 JSON)
        in: header
        name: PAYMENT-SIGNATURE
        type: string
      - description: JSON-RPC SendMessage request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.A2ARequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.A2AResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.UnauthorizedError'
        "402":
          description: Payment Required
          schema:
            $ref: '#/definitions/x402.PaymentRequired'
        "409":
          description: conversation_unavailable or agent_not_minted
          schema:
            $ref: '#/definitions/errors.ConflictError'
        "502":
          description: runtime_unavailable
          schema:
            $ref: '#/definitions/errors.UnavailableError'
      summary: A2A SendMessage (JSON-RPC)
      tags:
      - A2A
  /agent/collections:
    get:
      parameters:
      - in: query
        name: chainId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.AgentCollectionsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "401":
          description: missing_authorization or invalid_token
          schema:
            $ref: '#/definitions/errors.UnauthorizedError'
        "502":
          description: runtime_unavailable
          schema:
            $ref: '#/definitions/errors.UnavailableError'
      security:
      - BearerAuth: []
      summary: List agent collections
      tags:
      - AgentCollections
  /agent/guidance:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.AgentGuidanceResponse'
        "401":
          description: missing_authorization or invalid_token
          schema:
            $ref: '#/definitions/errors.UnauthorizedError'
        "502":
          description: runtime_unavailable
          schema:
            $ref: '#/definitions/errors.UnavailableError'
      security:
      - BearerAuth: []
      summary: Get agent guidance
      tags:
      - Config
    put:
      consumes:
      - application/json
      parameters:
      - description: Agent guidance
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.SetAgentGuidanceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.AgentGuidanceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "401":
          description: missing_authorization or invalid_token
          schema:
            $ref: '#/definitions/errors.UnauthorizedError'
        "502":
          description: runtime_unavailable
          schema:
            $ref: '#/definitions/errors.UnavailableError'
      security:
      - BearerAuth: []
      summary: Set agent guidance
      tags:
      - Config
  /agent/registration:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.AgentRegistrationResponse'
        "401":
          description: missing_authorization or invalid_token
          schema:
            $ref: '#/definitions/errors.UnauthorizedError'
        "404":
          description: draft_not_found
          schema:
            $ref: '#/definitions/errors.NotFoundError'
        "502":
          description: runtime_unavailable
          schema:
            $ref: '#/definitions/errors.UnavailableError'
      security:
      - BearerAuth: []
      summary: Get agent registration draft
      tags:
      - AgentRegistration
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Collection address
        in: formData
        name: collectionAddress
        required: true
        type: string
      - description: Agent name
        in: formData
        name: name
        required: true
        type: string
      - description: Token id this agent clones
        in: formData
        name: cloneOf
        type: integer
      - description: Attributes as a JSON object string; must include the required
          attributes
        in: formData
        name: attributes
        required: true
        type: string
      - description: Base image to frame
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.AgentRegistrationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "401":
          description: missing_authorization, invalid_token or missing_owner
          schema:
            $ref: '#/definitions/errors.UnauthorizedError'
        "502":
          description: runtime_unavailable
          schema:
            $ref: '#/definitions/errors.UnavailableError'
      security:
      - BearerAuth: []
      summary: Save agent registration draft
      tags:
      - AgentRegistration
  /agent/registration/ens-info:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.EnsInfoResponse'
        "401":
