basePath: /
definitions:
  enums.BootstrapStatus:
    enum:
    - awaiting-vault
    - ready
    type: string
    x-enum-varnames:
    - BootstrapStatusAwaitingVault
    - BootstrapStatusReady
  enums.ConversationPlatform:
    enum:
    - none
    - slack
    type: string
    x-enum-varnames:
    - ConversationPlatformNone
    - ConversationPlatformSlack
  enums.DbDriver:
    enum:
    - postgres
    - mysql
    - mariadb
    type: string
    x-enum-varnames:
    - DbDriverPostgres
    - DbDriverMySQL
    - DbDriverMariaDB
  enums.MessageRole:
    enum:
    - user
    - assistant
    - system
    type: string
    x-enum-varnames:
    - MessageRoleUser
    - MessageRoleAssistant
    - MessageRoleSystem
  errors.ValidationError:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
  fiber.Map:
    additionalProperties: true
    type: object
  requests.CreateMcpConnectionRequest:
    properties:
      authHeaderName:
        type: string
      authHeaderValue:
        type: string
      name:
        type: string
      url:
        type: string
    type: object
  requests.CreateResponseRequest:
    properties:
      conversationId:
        type: string
      forceConclusion:
        type: boolean
      input:
        items:
          $ref: '#/definitions/requests.InputMessageRequest'
        type: array
      options:
        $ref: '#/definitions/requests.InputOptionsRequest'
      platform:
        $ref: '#/definitions/enums.ConversationPlatform'
      prompt:
        type: string
      tools:
        items:
          $ref: '#/definitions/requests.InputToolRequest'
        type: array
    type: object
  requests.InputMessageRequest:
    properties:
      author:
        type: string
      content:
        type: string
      id:
        type: string
      role:
        $ref: '#/definitions/enums.MessageRole'
      timestamp:
        type: string
    type: object
  requests.InputOptionsRequest:
    properties:
      maxTokens:
        type: integer
      stop:
        items:
          type: string
        type: array
      temperature:
        type: number
    type: object
  requests.InputToolEndpointRequest:
    properties:
      authHeader:
        type: string
      kind:
        type: string
      url:
        type: string
    type: object
  requests.InputToolRequest:
    properties:
      description:
        type: string
      endpoint:
        $ref: '#/definitions/requests.InputToolEndpointRequest'
      name:
        type: string
      parameters:
        additionalProperties: {}
        type: object
    type: object
  requests.SetDbConfigRequest:
    properties:
      database:
        type: string
      driver:
        $ref: '#/definitions/enums.DbDriver'
      host:
        type: string
      password:
        type: string
      port:
        type: integer
      setup:
        type: boolean
      username:
        type: string
    type: object
  requests.SetLlmConfigRequest:
    properties:
      apiKey:
        type: string
      baseUrl:
        type: string
      extensions:
        additionalProperties: {}
        type: object
      model:
        type: string
      provider:
        type: string
    type: object
  requests.VerifyAuthRequest:
    properties:
      address:
        type: string
      nonce:
        type: string
      signature:
        type: string
    type: object
  responses.AgentIdentitySnapshot:
    properties:
      collectionAddress:
        type: string
      error:
        type: string
      name:
        type: string
      resolved:
        type: boolean
      tokenId:
        type: integer
    type: object
  responses.GetAuthChallengeResponse:
    properties:
      expiresAt:
        type: string
      nonce:
        type: string
    type: object
  responses.GetBootstrapStatusResponse:
    properties:
      agentAddress:
        type: string
      identity:
        $ref: '#/definitions/responses.AgentIdentitySnapshot'
      lastError:
        type: string
      status:
        $ref: '#/definitions/enums.BootstrapStatus'
    type: object
  responses.GetHealthResponse:
    properties:
      status:
        type: string
      uptimeSeconds:
        type: integer
    type: object
  responses.GetLlmConfigResponse:
    properties:
      baseUrl:
        type: string
      createdAt:
        type: string
      id:
        type: string
      model:
        type: string
      provider:
        type: string
      setupStatus:
        type: string
      updatedAt:
        type: string
    type: object
  responses.ListMcpConnectionsResponse:
    properties:
      connections:
        items:
          $ref: '#/definitions/responses.McpConnectionResponse'
        type: array
    type: object
  responses.McpConnectionResponse:
    properties:
      createdAt:
        type: string
      headerAuthKeys:
        items:
          type: string
        type: array
      id:
        type: string
      name:
        type: string
      updatedAt:
        type: string
      url:
        type: string
    type: object
  responses.OutputMessage:
    properties:
      content:
        type: string
      id:
        type: string
      timestamp:
        type: string
    type: object
  responses.Response:
    properties:
      id:
        type: string
      isFinal:
        type: boolean
      output:
        items:
          $ref: '#/definitions/responses.OutputMessage'
        type: array
      stats:
        $ref: '#/definitions/responses.ResponseStats'
    type: object
  responses.ResponseStats:
    properties:
      iterations:
        type: integer
      tokens:
        type: integer
      toolCalls:
        type: integer
      wallClockMs:
        type: integer
    type: object
  responses.VerifyAuthResponse:
    properties:
      expiresAt:
        type: string
      token:
        type: string
    type: object
info:
  contact: {}
  description: 'Public HTTP front for one agent: auth (JWT + EIP-191), bootstrap status,
    config endpoints, /responses. Authenticated routes proxy to runtime_host on the
    loopback interface.'
  title: Agentic Agent Node — Gateway Host API
  version: "1.0"
paths:
  /auth/challenge:
    get:
      description: Returns a fresh nonce + expiry. The caller signs the nonce with
        their wallet (EIP-191 personal_sign) and posts the result to /auth/verify.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.GetAuthChallengeResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      summary: Auth challenge
      tags:
      - Auth
  /auth/verify:
    post:
      consumes:
      - application/json
      description: Verifies the EIP-191 signature, checks the recovered address against
        the NFT owner via the worker, and issues a HS256 JWT.
      parameters:
      - description: Address + signature + nonce
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.VerifyAuthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.VerifyAuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "401":
          description: nonce_not_found | signature_mismatch | not_authorized
          schema:
            $ref: '#/definitions/fiber.Map'
        "502":
          description: identity_not_found
          schema:
            $ref: '#/definitions/fiber.Map'
      summary: Auth verify
      tags:
      - Auth
  /bootstrap/status:
    get:
      description: Wallet lifecycle (`awaiting-vault` | `ready`) plus a best-effort
        NFT identity snapshot once the wallet is loaded.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.GetBootstrapStatusResponse'
      summary: Bootstrap status
      tags:
      - Bootstrap
  /config/db:
    get:
      produces:
      - application/json
      responses:
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Get DB config
      tags:
      - Config
    post:
      consumes:
      - application/json
      parameters:
      - description: DB config
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.SetDbConfigRequest'
      produces:
      - application/json
      responses:
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Set DB config
      tags:
      - Config
  /config/llm:
    delete:
      produces:
      - application/json
      responses:
        "204":
          description: ""
        "502":
          description: runtime_unavailable
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Delete LLM config
      tags:
      - Config
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.GetLlmConfigResponse'
        "404":
          description: not_configured
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Get LLM config
      tags:
      - Config
    post:
      consumes:
      - application/json
      parameters:
      - description: LLM config
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.SetLlmConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.GetLlmConfigResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "502":
          description: runtime_unavailable
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Set LLM config
      tags:
      - Config
  /config/mcp-connections:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.ListMcpConnectionsResponse'
        "502":
          description: runtime_unavailable
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: List MCP connections
      tags:
      - Config
    post:
      consumes:
      - application/json
      parameters:
      - description: MCP connection
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.CreateMcpConnectionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/responses.McpConnectionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "502":
          description: runtime_unavailable
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Create MCP connection
      tags:
      - Config
  /config/mcp-connections/{id}:
    delete:
      parameters:
      - description: MCP connection id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: ""
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "502":
          description: runtime_unavailable
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Delete MCP connection
      tags:
      - Config
  /health:
    get:
      description: Liveness probe; serves before bootstrap completes.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.GetHealthResponse'
      summary: Health
      tags:
      - Health
  /responses:
    post:
      consumes:
      - application/json
      parameters:
      - description: Conversation turn
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.CreateResponseRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "502":
          description: runtime_failed
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Create response
      tags:
      - Responses
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
