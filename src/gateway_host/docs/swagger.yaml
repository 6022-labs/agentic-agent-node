            $ref: '#/definitions/errors.InternalError'
      summary: Auth challenge
      tags:
      - Auth
  /auth/verify:
    post:
      consumes:
      - application/json
      description: Rebuilds the EIP-4361 message, verifies the EIP-191 signature,
        checks NFT ownership, issues a HS256 JWT.
      parameters:
      - description: Address + signature
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.VerifyAuthRequest'
      produces:
