info:
  contact: {}
  description: 'Public HTTP front for one agent: auth (JWT + EIP-191), bootstrap status,
    config endpoints, /responses. Authenticated routes proxy to runtime_host on the
    loopback interface.'
  title: Agentic Agent Node — Gateway Host API
  version: "1.0"
paths:
  /.well-known/agent-card.json:
    get:
      description: A2A v1.0 discovery document (ProtoJSON), open/unauthenticated.
        supportedInterfaces advertises the SendMessage endpoint. Requires agent identity,
        so it errors until the node is registered.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.WellKnownAgentCard'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.NotFoundError'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/errors.UnavailableError'
      summary: A2A agent card
      tags:
      - A2A
  /a2a:
    post:
      consumes:
      - application/json
      description: 'JSON-RPC 2.0 "SendMessage" (A2A v1.0). Maps the message onto one
        inference turn and returns an immediate agent Message in result.message. x402-gated
        like /responses: send a PAYMENT-SIGNATURE header.'
      parameters:
      - description: x402 v2 payment payload (base64 JSON)
        in: header
        name: PAYMENT-SIGNATURE
        type: string
      - description: JSON-RPC SendMessage request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.A2ARequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.A2AResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "402":
          description: Payment Required
          schema:
            $ref: '#/definitions/x402.PaymentRequired'
        "502":
          description: runtime_unavailable
          schema:
            $ref: '#/definitions/errors.UnavailableError'
      summary: A2A SendMessage (JSON-RPC)
      tags:
      - A2A
  /agent/collections:
    get:
      parameters:
      - in: query
        name: chainId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.AgentCollectionsResponse'
      security:
      - BearerAuth: []
      summary: List agent collections
      tags:
      - AgentCollections
  /agent/registration:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.AgentRegistrationResponse'
        "404":
          description: draft_not_found
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Get agent registration draft
      tags:
      - AgentRegistration
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Collection address
        in: formData
        name: collectionAddress
        required: true
        type: string
      - description: Agent name
        in: formData
        name: name
        required: true
        type: string
      - description: Agent role
        in: formData
        name: role
        required: true
        type: string
      - description: Token id this agent clones
        in: formData
        name: cloneOf
        type: integer
      - description: Attributes as a JSON object string
        in: formData
        name: attributes
        type: string
      - description: Base image to frame
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.AgentRegistrationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
      security:
      - BearerAuth: []
      summary: Save agent registration draft
      tags:
      - AgentRegistration
  /agent/registration/ens-info:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.EnsInfoResponse'
        "409":
          description: not_minted
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Get ENS calldata
      tags:
      - AgentRegistration
  /agent/registration/ens/check:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.RegistrationStatusResponse'
      security:
      - BearerAuth: []
      summary: Check ENS status
      tags:
      - AgentRegistration
  /agent/registration/mint-info:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.MintInfoResponse'
      security:
      - BearerAuth: []
      summary: Get mint calldata
      tags:
      - AgentRegistration
  /agent/registration/mint/check:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.RegistrationStatusResponse'
      security:
      - BearerAuth: []
      summary: Check mint status
      tags:
      - AgentRegistration
  /agent/registration/self:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.RegistrationStatusResponse'
        "404":
          description: draft_not_found
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Self mint + ENS register
      tags:
      - AgentRegistration
  /auth/challenge:
    get:
      description: Returns a fresh nonce + expiry. The caller signs the nonce with
        their wallet (EIP-191 personal_sign) and posts the result to /auth/verify.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.GetAuthChallengeResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      summary: Auth challenge
      tags:
      - Auth
  /auth/verify:
    post:
      consumes:
      - application/json
      description: Verifies the EIP-191 signature, checks the recovered address against
        the NFT owner via the worker, and issues a HS256 JWT.
      parameters:
      - description: Address + signature + nonce
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.VerifyAuthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.VerifyAuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "401":
          description: nonce_not_found | signature_mismatch | not_authorized
          schema:
            $ref: '#/definitions/fiber.Map'
        "502":
          description: identity_not_found
          schema:
            $ref: '#/definitions/fiber.Map'
      summary: Auth verify
      tags:
      - Auth
  /config:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.BlockchainConfigResponse'
      summary: Public chain config
      tags:
      - Config
  /config/llm:
    delete:
      produces:
      - application/json
      responses:
        "204":
          description: ""
        "502":
          description: runtime_unavailable
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Delete LLM config
      tags:
      - Config
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.GetLlmConfigResponse'
        "404":
          description: not_configured
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Get LLM config
      tags:
      - Config
    post:
      consumes:
      - application/json
      parameters:
      - description: LLM config
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.SetLlmConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.GetLlmConfigResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "502":
          description: runtime_unavailable
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Set LLM config
      tags:
      - Config
  /config/mcp-connections:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.ListMcpConnectionsResponse'
        "502":
          description: runtime_unavailable
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: List MCP connections
      tags:
      - Config
    post:
      consumes:
      - application/json
      parameters:
      - description: MCP connection
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.CreateMcpConnectionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/responses.McpConnectionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "502":
          description: runtime_unavailable
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Create MCP connection
      tags:
      - Config
  /config/mcp-connections/{id}:
    delete:
      parameters:
      - description: MCP connection id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: ""
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "502":
          description: runtime_unavailable
          schema:
            $ref: '#/definitions/fiber.Map'
      security:
      - BearerAuth: []
      summary: Delete MCP connection
      tags:
      - Config
  /config/payment-policy:
    delete:
      produces:
      - application/json
      responses:
        "204":
          description: ""
        "502":
